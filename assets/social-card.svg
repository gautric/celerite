<?xml version="1.0" encoding="UTF-8"?>
<!--
  Carte sociale (Open Graph / Twitter Card / Slack unfurl) — 1200 x 630.
  Source vectorielle ; le PNG servi aux réseaux est assets/og-image.png,
  régénéré par `make social` (rsvg-convert).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#070b18" />
      <stop offset="0.55" stop-color="#101934" />
      <stop offset="1" stop-color="#1b2748" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" />
      <stop offset="0.5" stop-color="#ff8a4c" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4d" />
      <stop offset="1" stop-color="#0b1227" />
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f6e" />
      <stop offset="1" stop-color="#0e1733" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- Ciel -->
  <rect width="1200" height="630" fill="url(#sky)" />

  <!-- Étoiles -->
  <g fill="#ffffff">
    <circle cx="96" cy="78" r="1.6" opacity=".55" />
    <circle cx="238" cy="52" r="1.1" opacity=".35" />
    <circle cx="372" cy="104" r="1.4" opacity=".45" />
    <circle cx="520" cy="46" r="1" opacity=".3" />
    <circle cx="676" cy="92" r="1.7" opacity=".5" />
    <circle cx="822" cy="40" r="1.2" opacity=".38" />
    <circle cx="968" cy="120" r="1.5" opacity=".42" />
    <circle cx="1104" cy="66" r="1.1" opacity=".32" />
    <circle cx="1052" cy="168" r="1.3" opacity=".28" />
    <circle cx="150" cy="188" r="1.2" opacity=".26" />
  </g>

  <!-- Reliefs : plans lointain puis proche (Meudon à gauche, Paris à droite) -->
  <path fill="url(#ridgeFar)" opacity=".85"
        d="M0 452 L120 430 L240 448 L360 436 L500 458 L640 470 L780 462 L920 474 L1060 466 L1200 480 L1200 630 L0 630 Z" />
  <path fill="url(#ridgeNear)"
        d="M0 500 C140 470 260 486 400 506 C560 528 720 514 880 520 C1000 524 1110 534 1200 528 L1200 630 L0 630 Z" />

  <!-- Faisceau laser A -> B, dégagé au-dessus des obstacles -->
  <line x1="168" y1="398" x2="1032" y2="436" stroke="url(#beam)" stroke-width="16"
        stroke-linecap="round" opacity=".45" filter="url(#glow)" />
  <line x1="168" y1="398" x2="1032" y2="436" stroke="url(#beam)" stroke-width="4.5"
        stroke-linecap="round" />
  <!-- Échantillons le long du trajet (200 points dans l'app) -->
  <g fill="#ffe8b0" opacity=".9">
    <circle cx="384" cy="407.5" r="2.6" />
    <circle cx="600" cy="417" r="2.6" />
    <circle cx="816" cy="426.5" r="2.6" />
  </g>

  <!-- Site A : Grande Coupole de Meudon (émetteur, 162 m) -->
  <g>
    <circle cx="168" cy="398" r="18" fill="#ff5a3c" opacity=".35" filter="url(#softGlow)" />
    <path d="M136 436 L136 412 A32 32 0 0 1 200 412 L200 436 Z" fill="#dfe8ff" opacity=".95" />
    <rect x="128" y="436" width="80" height="34" rx="4" fill="#aab9dd" opacity=".9" />
    <rect x="124" y="468" width="88" height="10" rx="3" fill="#8d9dc4" opacity=".85" />
    <circle cx="168" cy="398" r="6" fill="#ff3b30" />
  </g>

  <!-- Site B : Coupole Arago de l'Observatoire de Paris (récepteur) -->
  <g>
    <circle cx="1032" cy="436" r="16" fill="#ffd166" opacity=".35" filter="url(#softGlow)" />
    <path d="M1004 470 L1004 450 A28 28 0 0 1 1060 450 L1060 470 Z" fill="#dfe8ff" opacity=".95" />
    <rect x="998" y="470" width="68" height="30" rx="4" fill="#aab9dd" opacity=".9" />
    <rect x="994" y="498" width="76" height="10" rx="3" fill="#8d9dc4" opacity=".85" />
    <circle cx="1032" cy="436" r="6" fill="#ffd166" />
  </g>

  <!-- Repères de distance -->
  <g stroke="#6f86bb" stroke-width="1.5" opacity=".6">
    <line x1="168" y1="546" x2="1032" y2="546" stroke-dasharray="6 7" />
    <line x1="168" y1="538" x2="168" y2="554" />
    <line x1="1032" y1="538" x2="1032" y2="554" />
  </g>
  <text x="600" y="540" text-anchor="middle" font-size="22" fill="#9db1dc" letter-spacing="1.5">8,5 km · azimut 66°</text>

  <!-- Étiquettes des sites -->
  <text x="124" y="586" font-size="21" fill="#cfdcff" font-weight="600">Meudon · Grande Coupole</text>
  <text x="124" y="610" font-size="18" fill="#8699c6">émission à 162 m d'altitude</text>
  <text x="1076" y="586" text-anchor="end" font-size="21" fill="#cfdcff" font-weight="600">Paris · Coupole Arago</text>
  <text x="1076" y="610" text-anchor="end" font-size="18" fill="#8699c6">altitude récepteur réglable</text>

  <!-- Titre -->
  <g>
    <rect x="76" y="74" width="196" height="38" rx="19" fill="#ff3b30" opacity=".16" />
    <text x="98" y="100" font-size="19" fill="#ff8a7a" font-weight="700" letter-spacing="2.4">LIGNE DE VISÉE 3D</text>
  </g>
  <text x="76" y="196" font-size="66" font-weight="700" fill="#ffffff">Tir laser Meudon → Paris</text>
  <text x="76" y="252" font-size="31" fill="#9fb3d9">Le faisceau passe-t-il au-dessus du relief et des bâtiments ?</text>
  <text x="76" y="300" font-size="25" fill="#7389b8">Visualisation 3D géospatiale · profil en coupe · verdict DÉGAGÉ / OBSTRUÉ</text>

  <!-- Pile technique -->
  <g font-size="19" fill="#9db1dc">
    <rect x="76" y="330" width="138" height="36" rx="18" fill="#ffffff" opacity=".07" />
    <text x="145" y="354" text-anchor="middle">MapLibre GL</text>
    <rect x="224" y="330" width="112" height="36" rx="18" fill="#ffffff" opacity=".07" />
    <text x="280" y="354" text-anchor="middle">deck.gl</text>
    <rect x="346" y="330" width="116" height="36" rx="18" fill="#ffffff" opacity=".07" />
    <text x="404" y="354" text-anchor="middle">Chart.js</text>
    <rect x="472" y="330" width="206" height="36" rx="18" fill="#ffffff" opacity=".07" />
    <text x="575" y="354" text-anchor="middle">OpenStreetMap · IGN</text>
  </g>

  <!-- Domaine -->
  <text x="1124" y="100" text-anchor="end" font-size="22" fill="#6f86bb" letter-spacing="1.2">celerite.autric.net</text>

  <!-- Liseré bas aux couleurs du faisceau -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#beam)" opacity=".9" />
</svg>
